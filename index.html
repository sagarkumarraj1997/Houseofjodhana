<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>House of Jodhana · जोधाणा — Handcrafted in Jodhpur</title>
    <meta name="description"
        content="Devotional chowkis, pooja thalis, Kamdhenu idols and Pichwai gift sets, handcrafted in Jodhpur, Rajasthan.">
    <meta name="theme-color" content="#06173F">
    <link rel="icon" type="image/png" href="/assets/emblem-blue.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Jost:wght@300;400;500;600&family=Tiro+Devanagari+Hindi:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        /* boot screen — inlined so it paints before the bundle loads */
        #boot {
            position: fixed;
            inset: 0;
            background: #06173F;
            display: grid;
            place-items: center;
            z-index: 500;
            transition: opacity .8s
        }

        #boot.hide {
            opacity: 0;
            pointer-events: none
        }

        #boot img {
            width: 120px
        }

        #boot .b-word {
            width: 300px;
            margin-top: 22px
        }
    </style>
</head>

<body>
    <div id="progress"></div>
    <div id="boot">
        <div style="display:flex;flex-direction:column;align-items:center"><img src="/assets/emblem-color.png"
                alt="House of Jodhana"><img class="b-word" src="/assets/wordmark-white.png" alt="">
            <div
                style="font-family:'Tiro Devanagari Hindi',serif;color:rgba(251,247,239,.6);font-size:18px;margin-top:14px">
                खम्मा घणी</div>
        </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
